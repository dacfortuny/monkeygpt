[project]
name = "monkeygpt"
version = "0.1.0"
description = "LLM-powered insult sword fighting game."
authors = [{ name = "Didac Fortuny", email = "dacfortuny@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "omegaconf>=2.3.0,<3",
    "mistralai>=1.10.0,<2",
    "pandas>=2.2.2,<3",
    "python-telegram-bot>=21.0.0,<22",
    "strenum>=0.4.15,<0.5",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0.9,<5",
    "jupytext>=1.16.0,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.6.0,<0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
